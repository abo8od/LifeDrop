<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LifeDrop Core</title>
<link href="../../css/theme.css" rel="stylesheet"/>
<link href="../../css/style.css" rel="stylesheet"/>
<link href="../../css/theme-controls.css" rel="stylesheet"/>
<link href="../../css/dashboard.css" rel="stylesheet"/>
<link href="../../css/utilities.css" rel="stylesheet"/>
<link href="../../css/responsive.css" rel="stylesheet"/>
</head>
<body class="light dashboard-body" data-page="new-request">
<div class="dash-app">
<aside class="dash-sidebar">
<div class="dash-brand" style="display: flex; align-items: center; gap: 10px;">
    <div class="brand-logo-box"><img src="../../assets/logo.png" alt="LifeDrop Logo" /></div>
    <div class="dash-stack-2" style="gap:2px;">
      <div class="dash-brand__title">LifeDrop Core</div>
      <div class="dash-brand__subtitle">Blood Management</div>
    </div>
  </div>
<nav class="dash-nav"></nav>
<div class="dash-sidebar__footer"><a class="dash-nav__item" href="#" id="sidebar-logout-btn">Logout</a></div>
</aside>
<main class="dash-main">
<header class="dash-topbar"><div class="dash-topbar__group"><div class="dash-link-alert">Live Updates</div></div><div class="dash-topbar__group"><div class="dash-user-chip">Admin</div></div></header>
<div class="dash-content">
<section class="dash-page-header"><div class="dash-stack-3"><h1 class="dash-title-lg">Create New Request</h1><p class="dash-subtitle">Provide request details and save.</p></div></section>
<section class="dash-grid dash-layout-aside"><article class="dash-card"><div class="dash-card__body"><form data-api-form id="new-request-form" class="dash-stack-5"><div class="dash-form-grid dash-form-grid--2"><div class="dash-field"><label class="dash-label" for="blood-type">Blood Type</label><select class="dash-input" id="blood-type"><option>O+</option><option>O-</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option></select></div><div class="dash-field"><label class="dash-label" for="priority">Urgency</label><select class="dash-input" id="priority"><option>Normal</option><option>Urgent</option><option>Critical</option></select></div><div class="dash-field" style="grid-column: 1 / -1;"><label class="dash-label" for="units-needed">Units Needed</label><input class="dash-input" id="units-needed" min="1" required type="number" value="1"/></div></div><div class="dash-row-between"><div class="dash-muted" id="new-request-status">Ready to submit</div><button class="dash-btn dash-btn--primary" data-loading-text="Saving..." type="submit">Save Request</button></div></form></div></article><aside class="dash-card"><div class="dash-card__body dash-stack-5"><h2 class="dash-title-md">Request Tips</h2><div class="dash-metric-list"><div class="dash-metric-item"><strong>Blood Type</strong><span>Choose the required blood group.</span></div><div class="dash-metric-item"><strong>Urgency</strong><span>Select the current request priority.</span></div><div class="dash-metric-item"><strong>Units Needed</strong><span>Set the number of units needed.</span></div></div></div></aside></section>
</div></main></div>
<script src="../../js/app.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/pages.js"></script>
<script>
  (function () {
    var user = window.LifeDropApi && window.LifeDropApi.getCurrentUser();
    if (!user) {
      window.location.replace('../../pages/auth/login.html');
      return;
    }
    if (user.role === 'SystemAdmin') {
      window.location.replace('../system-admin/dashboard.html');
      return;
    }
    if (user.role !== 'HospitalAdmin' && user.role !== 'HospitalEmployee') {
      window.location.replace('../../pages/auth/login.html');
      return;
    }
    // Logout is wired by renderSidebar() in pages.js
  })();
</script>
</body>
</html>
