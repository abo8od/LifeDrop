<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password - Clinical Curator</title>
<link href="../../css/theme.css" rel="stylesheet"/>
<link href="../../css/style.css" rel="stylesheet"/>
<link href="../../css/auth.css" rel="stylesheet"/>
<link href="../../css/theme-controls.css" rel="stylesheet"/>
<link href="../../css/utilities.css" rel="stylesheet"/><link href="../../css/responsive.css" rel="stylesheet"/></head>
<body class="light">
<main class="page center-shell forgot-page">
<div class="forgot-timer">00:00</div>
<div class="auth-intro">
<div class="top-icon-wrap">
<div class="top-square-icon forgot-hero-icon">
<img alt="" src="../../assets/icons/recover-account.svg"/>
</div>
</div>
<h1 class="form-title center-title">Recover Your Account</h1>
<p class="form-subtitle center-subtitle auth-subtitle--narrow">
				Enter your registered email to receive a recovery code.
			</p>
</div>
<section class="card center-card auth-card--glass auth-card--compact">
<form class="auth-form forgot-form">
<div class="input-group">
<label class="input-label" for="field-1">Hospital Email Address</label>
<div class="input-with-icon">
<input class="input" id="field-1" placeholder="admin@hospital.org" type="email"/>
<span class="field-icon">
<img alt="" src="../../assets/icons/email.svg"/>
</span>
</div>
</div>
<button class="btn btn-primary btn-with-icon btn-block" data-loading-text="Processing..." type="submit">
<span>Send Code</span>
<span class="btn-icon">
<img alt="" src="../../assets/icons/arrow-right.svg"/>
</span>
</button>
<div class="center-link-divider"></div>
<div class="center-link-wrap">
<a class="back-link back-link--inline" href="login.html">
<span class="back-link__icon">
<img alt="" src="../../assets/icons/arrow-left.svg"/>
</span>
<span>Back to login</span>
</a>
</div>
</form>
</section>
<div class="auth-note">
<p>Access restricted to authorized Clinical Curator personnel.</p>
<p>All password reset attempts are logged for security auditing.</p>
</div>
</main>
<script src="../../js/app.js"></script>
</body>
</html>
