<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LifeDrop Core</title>
<link href="../../css/theme.css" rel="stylesheet"/>
<link href="../../css/style.css" rel="stylesheet"/>
<link href="../../css/theme-controls.css" rel="stylesheet"/>
<link href="../../css/dashboard.css" rel="stylesheet"/>
<link href="../../css/utilities.css" rel="stylesheet"/>
<link href="../../css/responsive.css" rel="stylesheet"/>
</head>
<body class="light dashboard-body" data-page="audit-logs">
<div class="dash-app dash-app--admin">
<aside class="dash-sidebar dash-sidebar--admin">
<div class="dash-brand-card">
    <div class="brand-logo-box"><img src="../../assets/logo.png" alt="LifeDrop Logo" /></div>
    <div>
      <div class="dash-brand__title">LifeDrop Core</div>
      <div class="dash-brand-card__eyebrow">Superadmin Portal</div>
    </div>
  </div>
<nav class="dash-nav"><a class="dash-nav__item dash-nav__item--admin" href="global-operations.html">Dashboard</a><a class="dash-nav__item dash-nav__item--admin" href="hospital-management.html">Hospital Management</a><a class="dash-nav__item dash-nav__item--admin is-active" href="audit-logs.html">Audit Logs</a><a class="dash-nav__item dash-nav__item--admin" href="global-settings.html">Global Settings</a><a class="dash-nav__item dash-nav__item--admin" href="employee-onboarding.html">Employees</a></nav>
<div class="dash-sidebar__footer"><a class="dash-nav__item" href="#" id="sidebar-logout-btn">Logout</a></div>
</aside>
<main class="dash-main"><header class="dash-topbar"><div class="dash-search dash-admin-search"><span class="dash-search__icon" aria-hidden="true">S</span><input placeholder="Search hospitals, logs, or donor IDs..." type="text"/></div><div class="dash-admin-toolbar"><div class="dash-user-chip dash-user-chip--brand">LifeDrop Core</div></div></header><div class="dash-content">
<div id="audit-root"><section class="dash-page-header"><div class="dash-row-between"><div class="dash-stack-2"><h1 class="dash-title-hero">Nationwide Audit Trail & Compliance</h1></div></div></section><section class="dash-filterbar dash-mb-24"><input class="dash-input" id="audit-search" placeholder="Search user, entity, or reference..." type="text"/><select class="dash-input" id="audit-action"><option value="">All Actions</option><option value="CREATE">Create</option><option value="UPDATE">Update</option><option value="DELETE">Delete</option></select><button class="dash-btn dash-btn--primary" id="audit-filter-btn" type="button">Apply Filters</button></section><section class="dash-card dash-mb-24"><div class="dash-table-wrap"><table class="dash-table"><thead><tr><th>Timestamp</th><th>Performed By</th><th>Action</th><th>Entity</th><th>Delta</th><th>Origin IP</th></tr></thead><tbody id="audit-table-body"></tbody></table></div></section><section class="dash-grid dash-grid--2"><article class="dash-card"><div class="dash-card__body dash-stack-5"><div class="dash-metric-item"><strong>Log integrity</strong><span id="audit-integrity">--</span></div><div class="dash-metric-item"><strong>Failed attempts</strong><span id="audit-failed">--</span></div><div class="dash-metric-item"><strong>Total rows</strong><span id="audit-count">--</span></div></div></article><article class="dash-card"><div class="dash-card__body dash-stack-5"><div class="dash-metric-item"><strong>Avg action/hour</strong><span id="audit-avg">--</span></div><div class="dash-metric-item"><strong>Peak load time</strong><span id="audit-peak">--</span></div></div></article></section></div>
</div></main></div>
<script src="../../js/app.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/pages.js"></script>
<script>
  (function () {
    if (!window.LifeDropApi || !LifeDropApi.getAccessToken()) {
      window.location.replace('../../pages/auth/login.html');
    }
    document.addEventListener('DOMContentLoaded', function () {
      ['go-logout-btn', 'sidebar-logout-btn'].forEach(function (id) {
        var btn = document.getElementById(id);
        if (!btn) return;
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          LifeDropApi.clearTokens();
          window.location.href = '../../pages/auth/login.html';
        });
      });
    });
  })();
</script>
</body>
</html>
