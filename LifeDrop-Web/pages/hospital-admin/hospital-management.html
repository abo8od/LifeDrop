<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LifeDrop Core</title>
<link href="../../css/theme.css" rel="stylesheet"/>
<link href="../../css/style.css" rel="stylesheet"/>
<link href="../../css/theme-controls.css" rel="stylesheet"/>
<link href="../../css/dashboard.css" rel="stylesheet"/>
<link href="../../css/utilities.css" rel="stylesheet"/>
<link href="../../css/responsive.css" rel="stylesheet"/>
</head>
<body class="light dashboard-body" data-page="hospital-management">
<div class="dash-app dash-app--admin">
<aside class="dash-sidebar dash-sidebar--admin">
<div class="dash-brand-card">
    <div class="brand-logo-box"><img src="../../assets/logo.png" alt="LifeDrop Logo" /></div>
    <div>
      <div class="dash-brand__title">LifeDrop Core</div>
      <div class="dash-brand-card__eyebrow">Superadmin Portal</div>
    </div>
  </div>
<nav class="dash-nav"><a class="dash-nav__item dash-nav__item--admin" href="global-operations.html">Dashboard</a><a class="dash-nav__item dash-nav__item--admin is-active" href="hospital-management.html">Hospital Management</a><a class="dash-nav__item dash-nav__item--admin" href="audit-logs.html">Audit Logs</a><a class="dash-nav__item dash-nav__item--admin" href="global-settings.html">Global Settings</a><a class="dash-nav__item dash-nav__item--admin" href="employee-onboarding.html">Employees</a></nav>
<div class="dash-sidebar__footer"><a class="dash-nav__item" href="#" id="sidebar-logout-btn">Logout</a></div>
</aside>
<main class="dash-main"><header class="dash-topbar"><div class="dash-search dash-admin-search"><span class="dash-search__icon" aria-hidden="true">S</span><input placeholder="Search hospitals, logs, or donor IDs..." type="text"/></div><div class="dash-admin-toolbar"><div class="dash-user-chip dash-user-chip--brand">LifeDrop Core</div></div></header><div class="dash-content">
<section class="dash-page-header"><div class="dash-row-between"><div class="dash-stack-2"><h1 class="dash-title-hero">Hospital Provisioning & Management</h1></div></div></section><section class="dash-grid dash-grid--4 dash-mb-24"><article class="dash-card"><div class="dash-card__body"><div class="dash-eyebrow">Total Facilities</div><div class="dash-stat-card__value" id="hm-total">--</div></div></article><article class="dash-card"><div class="dash-card__body"><div class="dash-eyebrow">Active Now</div><div class="dash-stat-card__value" id="hm-active">--</div></div></article><article class="dash-card"><div class="dash-card__body"><div class="dash-eyebrow">Pending Activation</div><div class="dash-stat-card__value" id="hm-pending">--</div></div></article><article class="dash-card dash-card--alert"><div class="dash-card__body"><div class="dash-eyebrow">Suspended Nodes</div><div class="dash-stat-card__value" id="hm-suspended">--</div></div></article></section><section class="dash-card" id="hospital-table-wrap"><div class="dash-table-wrap"><table class="dash-table"><thead><tr><th>Hospital</th><th>Reg ID</th><th>Admin Email</th><th>City</th><th>Status</th><th>Response</th></tr></thead><tbody id="hospital-table-body"></tbody></table></div></section>
</div></main></div>
<script src="../../js/app.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/pages.js"></script>
<script>
  (function () {
    if (!window.LifeDropApi || !LifeDropApi.getAccessToken()) {
      window.location.replace('../../pages/auth/login.html');
    }
    document.addEventListener('DOMContentLoaded', function () {
      ['go-logout-btn', 'sidebar-logout-btn'].forEach(function (id) {
        var btn = document.getElementById(id);
        if (!btn) return;
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          LifeDropApi.clearTokens();
          window.location.href = '../../pages/auth/login.html';
        });
      });
    });
  })();
</script>
</body>
</html>
