<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Employee Onboarding | LifeDrop Core</title>
<link href="../../css/theme.css" rel="stylesheet"/>
<link href="../../css/style.css" rel="stylesheet"/>
<link href="../../css/theme-controls.css" rel="stylesheet"/>
<link href="../../css/dashboard.css" rel="stylesheet"/>
<link href="../../css/utilities.css" rel="stylesheet"/>
<link href="../../css/responsive.css" rel="stylesheet"/>
</head>
<body class="light dashboard-body dash-page-light" data-page="employee-onboarding">
<div class="dash-app">
<aside class="dash-sidebar dash-sidebar--admin">
  <div class="dash-brand-card" style="display: flex; align-items: center; gap: 10px;">
    <div class="brand-logo-box"><img src="../../assets/logo.png" alt="LifeDrop Logo" /></div>
    <div>
      <div class="dash-brand__title">LifeDrop Core</div>
      <div class="dash-brand-card__eyebrow">Admin Portal</div>
    </div>
  </div>

  <nav class="dash-nav">
    <a class="dash-nav__item dash-nav__item--admin" href="../requester/dashboard-overview.html">Dashboard</a>
    <a class="dash-nav__item dash-nav__item--admin" href="../requester/request-management.html">Request Management</a>
    <a class="dash-nav__item dash-nav__item--admin" href="../requester/settings-profile.html">Settings</a>
    <a class="dash-nav__item dash-nav__item--admin is-active" href="employee-onboarding.html">User Management</a>
  </nav>

  <div class="dash-session-card dash-session-card--footer">
    <a class="dash-nav__item" href="#" id="eo-logout-btn">Logout</a>
  </div>
</aside>

<div class="dash-content">
  <section class="dash-onboarding-shell">
    <aside class="dash-onboarding-hero">
      <div>
        <div class="dash-title-hero">Employee</div>
        <div class="dash-title-hero" style="color:var(--muted);">Onboarding</div>
        <p class="dash-subtitle" style="max-width:320px;">
          Register a new Hospital Employee account for your hospital.
          Uses <code>POST /api/Hospitals/employee</code> (HospitalAdminOnly).
        </p>
      </div>
      <article class="dash-card">
        <div class="dash-card__body">
          <h3 class="dash-title-md" style="margin-bottom:16px;">Existing Staff</h3>
          <div class="dash-metric-list" id="staff-side-list">
            <div id="staff-list"></div>
          </div>
        </div>
      </article>
    </aside>

    <main class="dash-card dash-onboarding-form">
      <form data-api-form id="staff-form" class="dash-stack-6">
        <section class="dash-form-section">
          <div class="dash-form-section__title">
            <span class="dash-form-section__icon">👤</span>Personal Information
          </div>
          <div class="dash-form-grid dash-form-grid--2">
            <div class="dash-field">
              <label class="dash-label" for="staff-full-name">Full Name</label>
              <input class="dash-input" id="staff-full-name" required type="text"/>
            </div>
            <div class="dash-field">
              <label class="dash-label" for="staff-email">Email Address</label>
              <input class="dash-input" id="staff-email" required type="email"/>
            </div>
            <div class="dash-field">
              <label class="dash-label" for="staff-password">Password</label>
              <input class="dash-input" id="staff-password" required type="password"/>
            </div>
            <div class="dash-field">
              <label class="dash-label" for="staff-confirm-password">Confirm Password</label>
              <input class="dash-input" id="staff-confirm-password" required type="password"/>
            </div>
          </div>
        </section>
        <div class="dash-row-between">
          <a class="link" href="global-operations.html">Back</a>
          <button class="dash-btn dash-btn--primary" data-loading-text="Registering..." type="submit">
            Save &amp; Register
          </button>
        </div>
      </form>
    </main>
  </section>
</div>

<script src="../../js/app.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/pages.js"></script>
<script>
  // Auth guard — HospitalAdmin only
  (function () {
    var user = window.LifeDropApi && window.LifeDropApi.getCurrentUser();
    if (!user || user.role !== 'HospitalAdmin') {
      window.location.replace('../auth/login.html');
      return;
    }
  })();
  document.getElementById('eo-logout-btn').addEventListener('click', function (e) {
    e.preventDefault();
    LifeDropApi.clearTokens();
    window.location.href = '../auth/login.html';
  });
</script>
</body>
</html>
