<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Hospital Admin | LifeDrop Core</title>
<link href="../../css/theme.css" rel="stylesheet"/>
<link href="../../css/style.css" rel="stylesheet"/>
<link href="../../css/theme-controls.css" rel="stylesheet"/>
<link href="../../css/dashboard.css" rel="stylesheet"/>
<link href="../../css/utilities.css" rel="stylesheet"/>
<link href="../../css/responsive.css" rel="stylesheet"/>
</head>
<body class="light dashboard-body dash-page-light" data-page="system-admin-create-hospital-admin">
<div class="dash-app dash-app--admin">
<aside class="dash-sidebar dash-sidebar--admin">
  <div class="dash-brand-card">
    <div class="brand-logo-box"><img src="../../assets/logo.png" alt="LifeDrop Logo" /></div>
    <div>
      <div class="dash-brand__title">LifeDrop Core</div>
      <div class="dash-brand-card__eyebrow">System Admin Portal</div>
    </div>
  </div>

  <nav class="dash-nav">
    <a class="dash-nav__item dash-nav__item--admin" href="dashboard.html">Dashboard</a>
    <a class="dash-nav__item dash-nav__item--admin" href="create-hospital.html">Create Hospital</a>
  </nav>

  <div class="dash-session-card dash-session-card--footer">
    <a class="dash-nav__item" href="#" id="eo-logout-btn">Logout</a>
  </div>
</aside>

<main class="dash-main">
<header class="dash-topbar">
  <div class="dash-topbar__group"><div class="dash-link-alert">Admin Console</div></div>
  <div class="dash-admin-toolbar"><div class="dash-user-chip dash-user-chip--brand">SystemAdmin</div></div>
</header>
<div class="dash-content">
  <section class="dash-page-header">
    <div class="dash-stack-2">
      <h1 class="dash-title-hero">Create Admin</h1>
    </div>
  </section>

    <section class="dash-card dash-onboarding-form dash-max-w-800">
      <form data-api-form id="create-hospital-admin-form" class="dash-stack-6">
        <section class="dash-form-section">
          <div class="dash-form-section__title">
            <span class="dash-form-section__icon" aria-hidden="true">A</span>Admin Information
          </div>
          <div class="dash-form-grid dash-form-grid--2">
            <div class="dash-field">
              <label class="dash-label" for="ha-firstname">First Name</label>
              <input class="dash-input" id="ha-firstname" required type="text"/>
            </div>
            <div class="dash-field">
              <label class="dash-label" for="ha-lastname">Last Name</label>
              <input class="dash-input" id="ha-lastname" required type="text"/>
            </div>
            <div class="dash-field">
              <label class="dash-label" for="ha-email">Email Address</label>
              <input class="dash-input" id="ha-email" required type="email"/>
            </div>
            <div class="dash-field">
              <label class="dash-label" for="ha-password">Password</label>
              <input class="dash-input" id="ha-password" required type="password"/>
            </div>
            <div class="dash-field dash-grid-span-full">
              <label class="dash-label" for="ha-hospitalid">Hospital</label>
              <select class="dash-input" id="ha-hospitalid" required>
                <option value="">Loading hospitals...</option>
              </select>
            </div>
          </div>
        </section>
        <div class="dash-row-between">
          <a class="link" href="dashboard.html">Back</a>
          <button class="dash-btn dash-btn--primary" data-loading-text="Registering..." type="submit">
            Save &amp; Register
          </button>
        </div>
      </form>
      <div class="dash-status-slot dash-mt-24" id="cha-result" aria-live="polite"></div>
    </section>
</div>
</main>

<script src="../../js/app.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/pages.js"></script>
<script>
  // Auth guard
  (function () {
    var user = window.LifeDropApi && window.LifeDropApi.getCurrentUser();
    if (!user || user.role !== 'SystemAdmin') {
      window.location.replace('../auth/login.html');
    }
  })();
  var logoutBtn = document.getElementById('eo-logout-btn');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', function (e) {
      e.preventDefault();
      LifeDropApi.clearTokens();
      window.location.href = '../auth/login.html';
    });
  }
</script>
</body>
</html>
