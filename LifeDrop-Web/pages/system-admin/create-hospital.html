<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hospitals | LifeDrop Core</title>
<link href="../../css/theme.css" rel="stylesheet"/>
<link href="../../css/style.css" rel="stylesheet"/>
<link href="../../css/theme-controls.css" rel="stylesheet"/>
<link href="../../css/dashboard.css" rel="stylesheet"/>
<link href="../../css/utilities.css" rel="stylesheet"/>
<link href="../../css/responsive.css" rel="stylesheet"/>
<link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet"/>
</head>
<body class="light dashboard-body dash-page-light" data-page="system-admin-create-hospital">
<div class="dash-app dash-app--admin">
<aside class="dash-sidebar dash-sidebar--admin">
  <div class="dash-brand-card">
    <div class="brand-logo-box"><img src="../../assets/logo.png" alt="LifeDrop Logo" /></div>
    <div>
      <div class="dash-brand__title">LifeDrop Core</div>
      <div class="dash-brand-card__eyebrow">System Admin Portal</div>
    </div>
  </div>

  <nav class="dash-nav">
    <a class="dash-nav__item dash-nav__item--admin" href="dashboard.html">Dashboard</a>
    <a class="dash-nav__item dash-nav__item--admin is-active" href="create-hospital.html">Create Hospital</a>
  </nav>

  <div class="dash-session-card dash-session-card--footer">
    <a class="dash-nav__item" href="#" id="eo-logout-btn">Logout</a>
  </div>
</aside>

<main class="dash-main">
<header class="dash-topbar">
  <div class="dash-topbar__group"><div class="dash-link-alert">Admin Console</div></div>
  <div class="dash-admin-toolbar"><div class="dash-user-chip dash-user-chip--brand">SystemAdmin</div></div>
</header>
<div class="dash-content">
  <section class="dash-page-header">
    <div class="dash-stack-2">
      <h1 class="dash-title-hero">Hospitals</h1>
    </div>
  </section>

  <details class="dash-card dash-disclosure" id="create-hospital-panel">
    <summary class="dash-disclosure__summary">
      <span class="dash-disclosure__title">Create Hospital</span>
      <span class="dash-disclosure__hint">Register a hospital and choose its map location</span>
    </summary>
    <div class="dash-card__body dash-disclosure__body">
      <form data-api-form id="create-hospital-form" class="dash-stack-6">
        <section class="dash-form-section">
          <div class="dash-form-grid dash-form-grid--2">
            <div class="dash-field dash-grid-span-full">
              <label class="dash-label" for="hosp-name">Hospital Name</label>
              <input class="dash-input" id="hosp-name" required type="text"/>
            </div>
            <div class="dash-field dash-grid-span-full">
              <label class="dash-label" for="hosp-address">Address</label>
              <input class="dash-input" id="hosp-address" required type="text"/>
            </div>
            <div class="dash-field dash-grid-span-full">
              <label class="dash-label" for="hosp-phone">Phone Number</label>
              <input class="dash-input" id="hosp-phone" required type="tel" placeholder="+962790000000"/>
            </div>
            <div class="dash-field dash-grid-span-full">
              <label class="dash-label">Map Location</label>
              <div id="hospital-map" class="dash-map-picker"></div>
              <div class="dash-helper" id="hospital-map-status">Loading map...</div>
            </div>
            <div class="dash-field">
              <label class="dash-label" for="hosp-lat">Latitude</label>
              <input class="dash-input" id="hosp-lat" required type="number" step="any"/>
            </div>
            <div class="dash-field">
              <label class="dash-label" for="hosp-lng">Longitude</label>
              <input class="dash-input" id="hosp-lng" required type="number" step="any"/>
            </div>
          </div>
        </section>
        <div class="dash-row-between">
          <a class="link" href="dashboard.html">Back</a>
          <button class="dash-btn dash-btn--primary" data-loading-text="Registering..." type="submit">
            Save &amp; Register
          </button>
        </div>
      </form>
      <div class="dash-status-slot dash-mt-24" id="ch-result" aria-live="polite"></div>
    </div>
  </details>

  <section class="dash-card dash-mb-24">
    <div class="dash-card-header">
      <div class="dash-stack-2 dash-stack-tight">
        <h2 class="dash-title-md">Hospitals</h2>
        <div class="dash-card-note" id="hospitals-visible-count"></div>
      </div>
    </div>
    <div class="dash-table-wrap">
      <table class="dash-table">
        <thead>
          <tr><th>Hospital</th><th>Location</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="hospitals-page-tbody">
          <tr><td colspan="4" class="dash-muted dash-table-message">Loading hospitals...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="dash-card-footer">
      <button class="dash-btn dash-btn--secondary" id="hospitals-show-more-btn" type="button">Show more</button>
    </div>
  </section>
</div>
</main>

<script src="../../js/app.js"></script>
<script src="../../js/api.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../../js/pages.js"></script>
<script>
  // Auth guard
  (function () {
    var user = window.LifeDropApi && window.LifeDropApi.getCurrentUser();
    if (!user || user.role !== 'SystemAdmin') {
      window.location.replace('../auth/login.html');
    }
  })();
  var logoutBtn = document.getElementById('eo-logout-btn');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', function (e) {
      e.preventDefault();
      LifeDropApi.clearTokens();
      window.location.href = '../auth/login.html';
    });
  }
</script>
</body>
</html>
